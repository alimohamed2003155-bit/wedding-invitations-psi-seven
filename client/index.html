<!doctype html>
<!-- اللغة والاتجاه بيتظبطوا من جافاسكريبت حسب اختيار المستخدم
     (client/src/i18n/index.js) — العربي هو الأساسي -->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ميثاق — دعوة زفافك في لينك واحد، بتصميم يليق بيوم عمرك</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Amiri = خط العناوين العربي (Playfair Display مفيهوش حروف عربي أصلًا،

         والعربي بياخد Amiri تلقائيًا من نفس القايمة. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800;900&display=swap"

    />
